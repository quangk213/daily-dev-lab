<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Developer Day</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <section class="card">
      <div class="title">
        <h1>&#9996; Dev daily</h1>
        <p>&#9728; Monday, Aug 24</p>
      </div>

      <div class="goal">
        <p>Today I'm building</p>
        <div class="goal-item">
          <p>Rebuild my GitHub profile</p>
        </div>
      </div>

      <div class="progress">
        <p>Progress</p>
        <div class="progress-item">
          <div class="progress-bar-placeholder">
            <div class="progress-bar"></div>
          </div>
          <span>75%</span>
        </div>
      </div>

      <div class="focus">
        <p>Today's focus</p>
        <div class="focus-items">
          <div class="focus-item">
            <p>HTML</p>
            <span>&#9745;</span>
          </div>
          <div class="focus-item">
            <p>CSS</p>
            <span>&#9745;</span>
          </div>
          <div class="focus-item">
            <p>GIT</p>
            <span>&#9745;</span>
          </div>
        </div>
      </div>

      <button class="btn">View my Github &#8594;</button>
      <p class="footer">Day 1 of building something daily</p>
    </section>
  </body>
</html>
